
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
</head>
<body>
  <h3>Trình phát nhạc</h3>

  <select id="songs">
    <option value="">Đang tải bài hát...</option>
  </select>

  <br><br>
  <audio id="player" controls preload="none" style="width:100%"></audio>

  <script>
    const select = document.getElementById("songs");
    const player = document.getElementById("player");

    fetch("./songs.json")
      .then(res => {
        if (!res.ok) throw new Error("Không tải được songs.json");
        return res.json();
      })
      .then(songs => {
        select.innerHTML = "";

        songs.forEach((song, index) => {
          const option = document.createElement("option");
          option.value = index;
          option.textContent = song.title + " - " + (song.artist || "Unknown");
          select.appendChild(option);
        });

        select.onchange = () => {
          const song = songs[select.value];
          if (!song) return;

          player.src = song.url;
          player.play().catch(err => console.error("Lỗi phát nhạc:", err));
        };

        select.selectedIndex = 0;
        if (songs.length) {
          player.src = songs[0].url;
        }
      })
      .catch(err => {
        select.innerHTML = '<option>Không tải được danh sách nhạc</option>';
        console.error(err);
      });
  </script>
</body>
</html>
